schema: spec-driven

# Constraints the OpenSpec CLI cannot infer from the code. AGENTS.md is the
# single source of truth for product principles and non-goals, so this points
# at them rather than restating them, and spends its tokens on what only
# matters while an artifact is being written.
context: |
  Natter is a deliberately small BYO-endpoint Android chat client. Product
  principles and the explicit non-goals live in AGENTS.md; a change that would
  alter one must name it rather than drift into it.
  Hosts, devices, addresses, and people in any artifact read as placeholders:
  <llama-swap-host>, <dev-box>, <tls-front-host>, <device>, and example
  addresses from 192.0.2.0/24. See AGENTS.md "Publishing hygiene".

rules:
  proposal:
    - State what is out of scope, and name any non-goal it would touch
    - One screen or subsystem per proposal; several tiny changes beat one rewrite
    - A new dependency, permission, or network destination carries its reason
      in one sentence
    - "Name the user-facing surface and its UX impact per
      openspec/design-ux-guidelines.md, or state that the change has no
      user-facing surface"
  specs:
    - "For user-facing behavior, scenarios cover loading, empty, error, and
      cancellation where relevant; cite openspec/design-ux-guidelines.md and
      state the accessibility expectation when the change affects it"
  design:
    - "Include a `## UX and interaction` section covering states, motion,
      accessibility, copy, and dark mode; cite openspec/design-ux-guidelines.md;
      state when a row does not apply"
  tasks:
    - A task that touches the network path closes with an on-device round
      against a live endpoint, recorded in validation.md under the change
    - Every task names the check that closes it, a command or a behaviour
      observed on the device
    - Reference existing patterns before inventing new ones
    - "A change whose spec delta touches a capability covered by the
      acceptance suite (`integration_test/accept/`) names the scenario to add
      or update in its tasks, or records why none applies"
    - "A UI task names the states it implements and how to verify them; a
      visual change owes an on-device look on the emulator on <dev-box>, or on
      <device> as a fallback"

operations:
  apply:
    guidance:
      - "Before marking a UI task done, check the implementation against
        openspec/design-ux-guidelines.md and note any deliberate exception in
        the task or a follow-up"
